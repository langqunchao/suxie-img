<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人物头像素材库 - 绘画参考工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- 左侧/上部：照片展示区 -->
        <div class="photo-panel">
            <div class="image-wrapper" id="imageWrapper">
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <p class="loading-text">正在加载素材...</p>
                </div>
                <img
                    id="referenceImage"
                    src=""
                    alt="人物摄影参考素材"
                    class="reference-image"
                >
                <button class="heart-btn" id="heartBtn" title="收藏">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 右侧/下部：控制面板 -->
        <div class="control-panel">
            <header class="site-header">
                <h1>人物头像素材库</h1>
                <p class="subtitle">为绘画爱好者提供的人物摄影参考工具</p>
            </header>

            <div class="control-body">
                <div class="filter-bar" id="filterBar">
                    <button class="filter-tag active" data-query="portrait">全部</button>
                    <button class="filter-tag" data-query="asian portrait">亚洲人</button>
                    <button class="filter-tag" data-query="woman portrait">女性</button>
                    <button class="filter-tag" data-query="man portrait">男性</button>
                    <button class="filter-tag" data-query="elderly portrait">老人</button>
                    <button class="filter-tag" data-query="child portrait">儿童</button>
                    <button class="filter-tag" data-query="animal">动物</button>
                </div>

                <div class="orientation-bar" id="orientationBar">
                    <button class="orientation-tag active" data-orientation="portrait">全身/半身</button>
                    <button class="orientation-tag" data-orientation="squarish">特写</button>
                </div>

                <div class="controls">
                    <button class="btn-switch" id="switchBtn">
                        <span class="btn-icon">&#8634;</span>
                        <span class="btn-text">换一张</span>
                    </button>
                    <button class="btn-favorites" id="btnFavorites">
                        <span class="btn-icon">&#9829;</span>
                        <span class="btn-text">收藏夹</span>
                    </button>
                </div>

            </div>

            <div class="timer-bar" id="timerBar">
                <div class="timer-modes">
                    <select class="timer-mode-select" id="timerModeSelect">
                        <option value="10">10分钟</option>
                        <option value="20">20分钟</option>
                        <option value="30">30分钟</option>
                        <option value="0" selected>不限时</option>
                    </select>
                </div>
                <div class="timer-display" id="timerDisplay">--:--</div>
                <div class="timer-actions">
                    <button class="timer-action-btn" id="timerToggle" title="开始/暂停">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                    <button class="timer-action-btn" id="timerReset" title="重置">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 收藏夹全屏视图 -->
    <div class="favorites-view" id="favoritesView">
        <div class="favorites-header">
            <button class="btn-back" id="btnBack">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
                返回
            </button>
            <h2>我的收藏夹</h2>
            <span class="favorites-count" id="favoritesCount">0 张</span>
        </div>
        <div class="masonry-grid" id="masonryGrid"></div>
        <div class="favorites-empty" id="favoritesEmpty">
            <p>暂无收藏图片</p>
            <p class="empty-hint">在主页点击图片右上角的爱心即可收藏</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
